services:
  postgres:
    image: postgres:16
    container_name: tasktracker-postgres
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: tasktracker
    ports:
      - "5432:5432"
    volumes:
      - tasktracker-pgdata:/var/lib/postgresql/data

volumes:
  tasktracker-pgdata: